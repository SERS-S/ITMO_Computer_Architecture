limit: 1000
memory_size: 0x1000

memory_mapped_io:
  0x80: [67, 111, 109, 112, 117, 116, 101, 114, 115, 32, 97, 114, 101, 32, 97, 119, 101, 115, 111, 109, 101, 33, 0]
  0x84: []

reports:
  - name: Trace
    slice: all
    view: |
      {pc:hex} {pc:label}

  - name: Result
    slice: last
    view: |
      input:  {io:0x80:dec}
      output: {io:0x84:hex}
